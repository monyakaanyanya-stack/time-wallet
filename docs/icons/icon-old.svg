<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Wallet shape -->
  <rect x="106" y="156" width="300" height="220" rx="32" fill="none" stroke="url(#g)" stroke-width="18"/>
  <rect x="280" y="230" width="126" height="68" rx="16" fill="url(#g)" opacity="0.2"/>
  <circle cx="340" cy="264" r="14" fill="url(#g)"/>
  <!-- Clock hand hint -->
  <line x1="200" y1="210" x2="200" y2="265" stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>
  <line x1="200" y1="265" x2="230" y2="285" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
  <!-- TW text -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="52" fill="url(#g)" opacity="0.6">TIME WALLET</text>
</svg>
