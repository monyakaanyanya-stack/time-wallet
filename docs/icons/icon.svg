<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="leather6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3d2e"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#daa520"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg6)"/>
  <!-- Wallet body -->
  <rect x="86" y="160" width="340" height="240" rx="24" fill="url(#leather6)"/>
  <!-- Wallet fold line -->
  <line x1="86" y1="280" x2="426" y2="280" stroke="#2a1a10" stroke-width="3"/>
  <!-- Wallet top flap -->
  <path d="M86 280 L86 180 Q86 160 106 160 L406 160 Q426 160 426 180 L426 280" fill="url(#leather6)" stroke="#4a2e1e" stroke-width="2"/>
  <!-- Wallet clasp -->
  <rect x="230" y="270" width="52" height="20" rx="10" fill="url(#gold6)"/>
  <!-- Clock coin peeking out from top -->
  <circle cx="256" cy="145" r="80" fill="url(#gold6)"/>
  <circle cx="256" cy="145" r="68" fill="#b8860b" opacity="0.3"/>
  <circle cx="256" cy="145" r="65" fill="none" stroke="#8B6914" stroke-width="2"/>
  <!-- Clock face on coin -->
  <circle cx="256" cy="145" r="55" fill="#1a1a2e" opacity="0.8"/>
  <!-- Clock markers -->
  <line x1="256" y1="95" x2="256" y2="105" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="185" x2="256" y2="195" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <line x1="206" y1="145" x2="216" y2="145" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <line x1="296" y1="145" x2="306" y2="145" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock hands -->
  <line x1="256" y1="145" x2="256" y2="108" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="145" x2="288" y2="128" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="145" r="4" fill="#ffd700"/>
  <!-- Wallet stitch detail -->
  <line x1="100" y1="350" x2="115" y2="350" stroke="#6d4c3a" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,6"/>
  <line x1="397" y1="350" x2="412" y2="350" stroke="#6d4c3a" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,6"/>
</svg>