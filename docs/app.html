<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yutora — Web体験版は終了しました</title>
<meta name="description" content="旧「Time Wallet」Web体験版の提供は終了しました。YutoraはiOSアプリとして開発を続けています。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4eee3">
<link rel="icon" href="icons/icon.svg">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#14110d;--paper:#f4eee3;--paper-2:#ece4d6;
  --ink-t:#1d1812;--ink-t2:rgba(29,24,18,.66);--ink-t3:rgba(29,24,18,.44);
  --line-l:rgba(29,24,18,.13);--green:#5f9c72;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --sans:"Inter","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);background:var(--paper);color:var(--ink-t);line-height:2.0;letter-spacing:.012em;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line-l)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;max-width:760px;margin:0 auto;padding:0 28px}
.brand{font-family:var(--serif);font-weight:600;font-size:1.3rem;display:flex;align-items:center;gap:.5em}
.brand .mk{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(95,156,114,.6)}
main{flex:1;display:flex;align-items:center}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:64px 28px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.5rem,4.6vw,2.1rem);line-height:1.5;margin-bottom:22px}
p{font-size:1rem;color:var(--ink-t2)}
p+p{margin-top:1em}
.cta{display:inline-block;margin-top:34px;padding:14px 28px;border:1px solid var(--ink-t);border-radius:4px;font-size:.95rem;color:var(--ink-t);transition:background .3s,color .3s}
.cta:hover{background:var(--ink-t);color:var(--paper)}
footer{border-top:1px solid var(--line-l);padding:32px 0;font-size:.82rem;color:var(--ink-t3);text-align:center}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="index.html"><span class="mk"></span>Yutora</a>
  </div>
</header>

<main>
<div class="wrap">
  <h1>Web体験版（旧 Time Wallet）の提供は終了しました</h1>
  <p>試作段階のWeb体験版をお使いいただき、ありがとうございました。ここで検証した仕組みは、iOSアプリ「Yutora」として作り直しています。</p>
  <p>Yutoraは、SNSをやめさせるアプリではありません。自分で決めたSNS予算の中で使い方を整え、SNSの外で過ごした毎日を写真と記録で残していくアプリです。</p>
  <a class="cta" href="index.html">Yutoraの紹介ページへ</a>
</div>
</main>

<footer>© 2026 Yutora</footer>

<script>
// 旧PWAの後始末：インストール済み端末のService Workerとキャッシュを解除し、
// 古い体験版（キャッシュ済みの旧app.html）が配信され続けないようにする。
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()))
    .catch(() => {});
}
if (window.caches) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
}
</script>
</body>
</html>
